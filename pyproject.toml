[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drawio-application-landscape"
version = "0.2.0"
description = "Render capability and application landscape diagrams for draw.io from a CSV"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.8"]

[project.scripts]
landscape = "drawio_application_landscape.cli:main"

[tool.ruff.lint]
# Pin the rule set explicitly so CI is reproducible across ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
packages = [
    "drawio_application_landscape",
    "drawio_application_landscape.config",
    "drawio_application_landscape.utils",
]
